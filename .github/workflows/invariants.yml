name: invariants

# Proves, on every push and PR, the invariants that start.bat enforces at launch. These guard
# failures that are SILENT locally: the app keeps running, reports look healthy, and the damage
# only surfaces as apparent edge that dies on contact with real money.
#
# Every job here is offline and deterministic - no network, no market data, no trained artifacts.
# A red build means an invariant the evidence depends on has been broken.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The audit suite imports train_share_path_model, whose shared model code pulls in joblib
      # and scikit-learn (and the ensemble families pull lightgbm/catboost). Installing only
      # duckdb/pandas/numpy/pyarrow made the workflow fail on import, not on an invariant.
      - name: Install runtime dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r backend/requirements.txt
          pip install --quiet joblib scikit-learn lightgbm catboost pyflakes

      # --- complete-trade correctness -------------------------------------------------------
      - name: Audit regressions (labels / M0 unit / execution / logging)
        run: python -m backend.trade_forecast.test_audit_fixes

      - name: Builder integration (EXECUTES the label path)
        run: python -m backend.trade_forecast.test_builder_integration

      - name: Complete-trade serving and optimizer integration
        run: python -m backend.trade_forecast.test_complete_trade_forecast

      - name: Forward evidence isolation + frozen threshold artifact
        run: python backend/trade_forecast/forward_evidence.py --selftest

      - name: Calibration-only threshold freezer
        run: python -m backend.trade_forecast.freeze_complete_trade_threshold --selftest

      - name: M0 gates (matched-random, BH, profit concentration)
        run: python backend/trade_forecast/m0_gates.py --selftest

      - name: Ledger V2 end-to-end (real DuckDB write/read/resolve/evaluate)
        run: python -m backend.trade_forecast.test_ledger_v2_end_to_end

      - name: Evidence completion (durable spool / eligibility / own-L2 outcomes)
        run: python -m backend.trade_forecast.test_evidence_completion

      - name: Forward M0 V2 evaluator (incl. import boundary)
        run: python -m backend.trade_forecast.evaluate_complete_trade_m0_v2_forward --selftest

      - name: Serving integration (EXECUTES loaders, real pointer swaps)
        run: python -m backend.trade_forecast.test_serving_integration

      - name: Champion resolver (atomic promotion actually reaches serving)
        run: python backend/trade_forecast/champion_resolver.py --selftest

      - name: Frozen-artifact pinning
        run: python backend/trade_forecast/freeze_guard.py --selftest

      # --- isolated Binance perpetual paper engine -----------------------------------------
      - name: Binance paper execution, risk, recovery and DB isolation
        run: python -m backend.binance_paper.selftest

      - name: Binance paper typed API and hard-off controls
        run: python -m backend.binance_paper.api_selftest

      - name: Exit-plan and scenario-engine selftests
        run: |
          python -c "import sys; sys.path.insert(0,'backend'); \
            from trade_forecast.trade_labels import selftest as a; \
            from trade_forecast.scenario_engine import selftest as b; a(); b()"

      # --- decision + deployment gates ------------------------------------------------------
      - name: Head permissions
        run: python backend/head_permissions.py --selftest

      - name: Challenger promotion gates
        run: python backend/promote_challenger.py --selftest

      - name: Long-window preflight classification
        run: python backend/preflight_longwindow.py --selftest

      # --- evidence collection --------------------------------------------------------------
      - name: Multi-venue collector schema + episode accounting
        run: python backend/venues/multi_venue_recorder.py --selftest

      - name: Venue admissibility (backlog / lead-lag / identity)
        run: python backend/venues/venue_admissibility.py --selftest

      - name: Collector evidence integrity (D1-D5)
        run: python backend/venues/test_collector_integrity.py

      # --- shared platform kernel -----------------------------------------------------------
      - name: Quant-platform kernel invariants
        run: python -m backend.quant_platform.test_kernel

      - name: Binance paper execution and accounting
        run: python -m backend.binance_paper.test_engine

      - name: Research validation and promotion gates
        run: python -m backend.quant_platform.test_research_validation

      - name: Hierarchical target-specific ensemble invariants
        run: python -m backend.research.hierarchical_ensemble_v1.selftest

      - name: Universal forecast adapter DuckDB invariants
        run: python -m backend.research.forecast_adapters_v1.selftest

      - name: Profit campaign execution and validation invariants
        run: python -m backend.research.profit_campaign_v1.selftest

      - name: Event-conditional V1 (fees, fills, horizon gate, fail-closed detectors)
        run: python -m backend.research.event_conditional_v1.selftest

      - name: Event-conditional V1 readiness report (must run, may be empty)
        run: python -m backend.research.event_conditional_v1.readiness

      # --- repo-wide consistency ------------------------------------------------------------
      - name: Strategy registry consistency
        run: python backend/research/audit_strategy_registry.py

      - name: Documentation table well-formedness
        run: python backend/research/check_doc_tables.py

      # --- preregistration integrity --------------------------------------------------------
      # A frozen protocol whose bytes changed is not a frozen protocol. This recomputes every
      # recorded hash and fails if any drifted, so an edit cannot pass review unnoticed.
      - name: Preregistration hashes unchanged
        run: python backend/research/verify_prereg_hashes.py

      - name: Every python file compiles
        run: python -m compileall -q backend

      - name: Python static checks
        run: python -m pyflakes backend

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Frontend lockfile, build and high-severity audit
        run: |
          npm ci
          npm run build
          npm audit --audit-level=high

  # Ubuntu module tests cannot verify Batch parsing, label targets, escaping or goto behaviour.
  # start.bat is the launch gate for every evidence run, so it is validated on the OS that runs it.
  startbat:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r backend/requirements.txt
          pip install --quiet joblib scikit-learn lightgbm catboost pyflakes

      # Parses the whole file and prints the resolved configuration without launching servers.
      - name: start.bat parses and resolves configuration
        shell: cmd
        run: |
          set BTC_VALIDATE_STARTUP=1
          call start.bat
          if errorlevel 1 exit /b 1

      - name: Every invariant selftest passes on Windows
        shell: cmd
        run: |
          python -m backend.trade_forecast.test_audit_fixes || exit /b 1
          python -m backend.trade_forecast.test_builder_integration || exit /b 1
          python -m backend.trade_forecast.test_complete_trade_forecast || exit /b 1
          python backend/trade_forecast/forward_evidence.py --selftest || exit /b 1
          python -m backend.trade_forecast.freeze_complete_trade_threshold --selftest || exit /b 1
          python backend/trade_forecast/m0_gates.py --selftest || exit /b 1
          python -m backend.trade_forecast.test_ledger_v2_end_to_end || exit /b 1
          python -m backend.trade_forecast.test_evidence_completion || exit /b 1
          python -m backend.trade_forecast.evaluate_complete_trade_m0_v2_forward --selftest || exit /b 1
          python -m backend.trade_forecast.test_serving_integration || exit /b 1
          python backend/trade_forecast/champion_resolver.py --selftest || exit /b 1
          python backend/trade_forecast/freeze_guard.py --selftest || exit /b 1
          python backend/head_permissions.py --selftest || exit /b 1
          python backend/promote_challenger.py --selftest || exit /b 1
          python backend/preflight_longwindow.py --selftest || exit /b 1
          python backend/venues/multi_venue_recorder.py --selftest || exit /b 1
          python backend/venues/venue_admissibility.py --selftest || exit /b 1
          python -m backend.quant_platform.test_kernel || exit /b 1
          python -m backend.binance_paper.test_engine || exit /b 1
          python -m backend.quant_platform.test_research_validation || exit /b 1
          python -m backend.research.hierarchical_ensemble_v1.selftest || exit /b 1
          python -m backend.research.forecast_adapters_v1.selftest || exit /b 1
          python -m backend.research.profit_campaign_v1.selftest || exit /b 1
          python -m backend.research.event_conditional_v1.selftest || exit /b 1
          python -m backend.research.event_conditional_v1.readiness || exit /b 1
          python backend/research/verify_prereg_hashes.py || exit /b 1
          python -m backend.binance_paper.selftest || exit /b 1
          python -m backend.binance_paper.api_selftest || exit /b 1
          python -m compileall -q backend || exit /b 1
          python -m pyflakes backend || exit /b 1
