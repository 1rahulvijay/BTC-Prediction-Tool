[pytest]
python_files = test_*.py

# Exclusions live here rather than in an `ignore =` key: pytest has no such ini option and
# silently warns instead of failing, so the exclusions would not have applied.
addopts =
    --import-mode=importlib
    --ignore=backend/trade_forecast/test_serving_integration.py
    --ignore=backend/research/test_120d_conditional_ev_pipeline.py
    --ignore=backend/research/test_120d_trade_policy_heads.py
    --ignore=backend/test_feed_writer_load.py

# testpaths previously listed only `tests` and `backend/venues`, which collected 5 tests while
# 93 existed. Everything else was invisible to pytest AND to CI, and pytest-style tests do not
# fail loudly when missed - running one as `python <file>` executes no test function and exits
# 0. backend/research/test_binance_maker_conversion.py demonstrated it: 4 tests, 29 assertions,
# exit 0 having run none of them.
testpaths =
    tests
    backend
    research

# --- Why each --ignore above exists. Not a convenience list. ---
#
# test_serving_integration / test_120d_conditional_ev_pipeline / test_120d_trade_policy_heads
#   Already covered by CI via module invocation (`python -m backend...`), where they pass.
#   They fail pytest COLLECTION only, on relative imports that resolve correctly under -m:
#   "ImportError: attempted relative import beyond top-level package". Rewriting those imports
#   to satisfy pytest would risk the module invocation that CI actually depends on, so the
#   working invocation is kept and pytest skips them. They are gated, just not by this step.
#
# test_feed_writer_load
#   A LOAD test, and CI already runs it as a script - where `main()` executes all seven test
#   functions PLUS run_sustained_rate(), a strict superset of what pytest would collect.
#   Collecting it here would double-run a ~45 second load test for no extra coverage
#   (the pytest step goes 7s -> 54s). Its `test_sustained_rate(seconds)` fixture collision was
#   fixed by renaming to run_sustained_rate(), so this exclusion is now a cost decision rather
#   than a workaround.
#
# FIXED, no longer excluded:
#   test_complement_and_opening_drift.py - the two analysis routines that pytest misread as
#   fixture requests are renamed analyse_complement / analyse_opening_drift, and its
#   missing-input path now REFUSES with exit 1 instead of returning 0.
