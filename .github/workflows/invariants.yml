name: invariants

# Proves, on every push and PR, the invariants that start.bat enforces at launch. These guard
# failures that are SILENT locally: the app keeps running, reports look healthy, and the damage
# only surfaces as apparent edge that dies on contact with real money.
#
# Every job here is offline and deterministic - no network, no market data, no trained artifacts.
# A red build means an invariant the evidence depends on has been broken.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The audit suite imports train_share_path_model, whose shared model code pulls in joblib
      # and scikit-learn (and the ensemble families pull lightgbm/catboost). Installing only
      # duckdb/pandas/numpy/pyarrow made the workflow fail on import, not on an invariant.
      - name: Install runtime dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r backend/requirements.txt
          pip install --quiet joblib scikit-learn lightgbm catboost pyflakes

      # --- complete-trade correctness -------------------------------------------------------
      - name: Audit regressions (labels / M0 unit / execution / logging)
        run: python -m backend.trade_forecast.test_audit_fixes

      - name: Builder integration (EXECUTES the label path)
        run: python -m backend.trade_forecast.test_builder_integration

      - name: Complete-trade serving and optimizer integration
        run: python -m backend.trade_forecast.test_complete_trade_forecast

      - name: Forward evidence isolation + frozen threshold artifact
        run: python backend/trade_forecast/forward_evidence.py --selftest

      - name: Calibration-only threshold freezer
        run: python -m backend.trade_forecast.freeze_complete_trade_threshold --selftest

      - name: M0 gates (matched-random, BH, profit concentration)
        run: python backend/trade_forecast/m0_gates.py --selftest

      - name: Ledger V2 end-to-end (real DuckDB write/read/resolve/evaluate)
        run: python -m backend.trade_forecast.test_ledger_v2_end_to_end

      - name: Evidence completion (durable spool / eligibility / own-L2 outcomes)
        run: python -m backend.trade_forecast.test_evidence_completion

      - name: Forward M0 V2 evaluator (incl. import boundary)
        run: python -m backend.trade_forecast.evaluate_complete_trade_m0_v2_forward --selftest

      - name: Serving integration (EXECUTES loaders, real pointer swaps)
        run: python -m backend.trade_forecast.test_serving_integration

      - name: Champion resolver (atomic promotion actually reaches serving)
        run: python backend/trade_forecast/champion_resolver.py --selftest

      - name: Frozen-artifact pinning
        run: python backend/trade_forecast/freeze_guard.py --selftest

      # --- isolated Binance perpetual paper engine -----------------------------------------
      - name: Binance paper execution, risk, recovery and DB isolation
        run: python -m backend.binance_paper.selftest

      - name: Binance paper typed API and hard-off controls
        run: python -m backend.binance_paper.api_selftest

      - name: Exit-plan and scenario-engine selftests
        run: |
          python -c "import sys; sys.path.insert(0,'backend'); \
            from trade_forecast.trade_labels import selftest as a; \
            from trade_forecast.scenario_engine import selftest as b; a(); b()"

      # --- decision + deployment gates ------------------------------------------------------
      - name: Quarantined prototypes, fee formula, non-blocking feed
        run: python backend/test_quarantine_and_feed.py

      - name: Regime HMM causal forward filter (train/serve partition parity)
        run: python backend/test_regime_causal_filter.py

      - name: Endogenous Kelly (own-order impact caps size)
        run: python backend/test_endogenous_kelly.py

      - name: Kelly scratch semantics (argmax invariance; naming discipline)
        run: python backend/test_kelly_scratch_semantics.py

      - name: Kelly sizing (scratches are not losses; LCB gate)
        run: python backend/test_kelly_scratch_handling.py

      - name: Feed writer load (REAL parquet handlers, measured capacity)
        run: python backend/test_feed_writer_load.py

      - name: Feed writer (bounded, counted, non-blocking)
        run: python backend/feed_writer.py --selftest

      # start.bat is the launch gate for every evidence run, but nothing read its bytes. Two
      # invocations had been corrupted into control characters (`backend<FF>eed_writer.py`),
      # which aborted startup on every launch.
      - name: Launcher integrity (every invoked path exists)
        run: python backend/test_launcher_integrity.py

      - name: Repository launcher layout
        run: python tests/test_repository_layout.py

      - name: Model registry (single source of artifact identity)
        run: python backend/model_registry.py --selftest

      - name: Artifact bundles (verify-before-deserialize, atomic publish)
        run: python backend/model_artifacts.py --selftest

      - name: Verified IO (hash-check BEFORE deserializing)
        run: python backend/verified_io.py --selftest

      - name: Artifact migration ratchet (raw save/load sites may not grow)
        run: python backend/artifact_migration_status.py --selftest

      - name: Control-plane auth (fail-closed, no default token)
        run: python backend/control_auth.py --selftest

      - name: Control-plane security over real HTTP
        run: python backend/test_control_plane_security.py

      - name: Production preflight policy
        run: python backend/production_readiness.py --selftest

      - name: Production HTTP and WebSocket boundary
        run: python backend/test_production_http_surface.py

      - name: Frozen-start model preflight entry point
        run: python backend/check_model_compatibility.py --selftest

      - name: Order lifecycle (a timeout is UNKNOWN, never REJECTED)
        run: python backend/order_lifecycle.py --selftest

      - name: Trading authority (real orders refused by default)
        run: python backend/trading_authority.py --selftest

      - name: Task supervisor (no detached tasks; dead CRITICAL blocks trust)
        run: python backend/task_supervisor.py --selftest

      - name: Close-only authority (a fault must not trap a position)
        run: python backend/test_close_only_authority.py

      - name: Canonical Polymarket incremental protocol
        run: python backend/test_polymarket_client_protocol.py

      - name: Feed protocol content health and quarantine
        run: python backend/test_feed_protocol_health.py

      - name: Head permissions
        run: python backend/head_permissions.py --selftest

      - name: Challenger promotion gates
        run: python backend/promote_challenger.py --selftest

      - name: Research suite coverage and failure propagation
        run: python research/run_all_sequence.py --selftest

      - name: Long-window preflight classification
        run: python backend/preflight_longwindow.py --selftest

      # --- evidence collection --------------------------------------------------------------
      - name: Multi-venue collector schema + episode accounting
        run: python backend/venues/multi_venue_recorder.py --selftest

      - name: Venue admissibility (backlog / lead-lag / identity)
        run: python backend/venues/venue_admissibility.py --selftest

      - name: RL data readiness (refuses execution RL without depth)
        run: python backend/venues/rl_data_readiness.py

      - name: Sequenced Binance L2 snapshot/diff/gap/replay invariants
        run: python backend/venues/binance_l2_recorder.py --selftest

      - name: Collector evidence integrity (D1-D5)
        run: python backend/venues/test_collector_integrity.py

      # --- shared platform kernel -----------------------------------------------------------
      - name: Quant-platform kernel invariants
        run: python -m backend.quant_platform.test_kernel

      - name: Binance paper execution and accounting
        run: python -m backend.binance_paper.test_engine

      # Both Phase-1 strategies shipped with a 6.0 bps take-profit against a 12.0 bps round trip:
      # every trade that reached its target still lost 6 bps. The accounting was correct, so
      # nothing caught it - no test asked whether a winning trade wins. This asserts that every
      # registered strategy's target clears the round trip, that StrategyBase refuses one that
      # does not, and that raising the engine's fees fails here rather than bleeding in paper.
      - name: Paper strategy economics (a winner must actually win)
        run: python -m backend.binance_paper.test_strategy_economics

      # The Polymarket fair-value module's leakage guard is STRUCTURAL: a Calibration carries
      # fitted_through_ms and decide() raises on any round at or before it, so a look-ahead
      # evaluation cannot be written by accident. The selftest proves the guard fires.
      - name: Polymarket calibrated fair value (leakage guard + dynamic exit)
        run: python -m backend.polymarket_paper.calibrated_fair_value --selftest

      # 21 of 31 trainers wrote model artifacts with NO integrity manifest, which is why
      # 12/12 artifacts fail identity and phold_challenger refuses to deploy any calibrator
      # (SOURCE_MODEL_REQUIRES_RETRAINING) - the live blocker on PM_CALIBRATED_FAIR_VALUE_V1.
      # An overnight retrain that skips the manifest leaves the strategy switched off silently.
      - name: Trainers write manifests (an unmanifested artifact blocks the calibrator)
        run: python backend/test_trainers_write_manifests.py

      - name: Research validation and promotion gates
        run: python -m backend.quant_platform.test_research_validation

      - name: Maker proxy charges passive entry plus explicit taker exit
        run: python research/maker_lever_test.py --selftest

      - name: Hierarchical target-specific ensemble invariants
        run: python -m backend.research.hierarchical_ensemble_v1.selftest

      - name: Universal forecast adapter DuckDB invariants
        run: python -m backend.research.forecast_adapters_v1.selftest

      - name: Profit campaign execution and validation invariants
        run: python -m backend.research.profit_campaign_v1.selftest

      - name: Kline timestamp unit contract (REST history vs live WS bar)
        run: python backend/test_kline_time_contract.py

      - name: Feature + model weight fixes (VWAP window, TCN per-sample weights)
        run: python backend/test_feature_and_weight_fixes.py

      - name: Round-state scoring fails closed on invalid artifact reload
        run: python backend/round_state_panel.py

      - name: Master-document consistency (static claims only)
        run: python backend/report_master_runtime_state.py --selftest

      - name: P(hold) calibration gate (default-off; required mode fails closed)
        run: python backend/phold_calibrator.py --selftest

      - name: Feature-contract readiness (stale artifacts vs current semantics)
        run: python backend/check_feature_contract.py --report || true

      - name: Event-conditional V1 (fees, fills, horizon gate, fail-closed detectors)
        run: python -m backend.research.event_conditional_v1.selftest

      - name: Event-conditional V1 readiness report (must run, may be empty)
        run: python -m backend.research.event_conditional_v1.readiness

      # --- repo-wide consistency ------------------------------------------------------------
      - name: Research claim audit (flags assumed/declared/unbounded results)
        run: python backend/research/audit_research_claims.py

      - name: Strategy registry consistency
        run: python backend/research/audit_strategy_registry.py

      - name: Documentation table well-formedness
        run: python backend/research/check_doc_tables.py

      - name: Current documentation matches executable feature/model contracts
        run: python backend/test_current_documentation_contract.py

      # --- preregistration integrity --------------------------------------------------------
      # A frozen protocol whose bytes changed is not a frozen protocol. This recomputes every
      # recorded hash and fails if any drifted, so an edit cannot pass review unnoticed.
      - name: Preregistration hashes unchanged
        run: python backend/research/verify_prereg_hashes.py

      # --- pytest suites --------------------------------------------------------------------
      # pytest was never invoked by this workflow, and a missed pytest-style test does not fail
      # loudly: running one as `python <file>` executes no test function and exits 0.
      # backend/research/test_binance_maker_conversion.py showed the cost - 4 tests and 29
      # assertions that had never once run. pytest.ini also limited collection to two
      # directories, so 5 of 86 tests were visible. Both are fixed; this step is the gate.
      - name: Pytest suites (86 tests this workflow previously never ran)
        run: python -m pytest -q

      # 14 files named test_*.py contained ZERO assertions - research studies that cannot fail,
      # which any runner records as OK. This fails on a NEW one, so the list cannot grow
      # silently. Self-tested: it verifies it can actually detect an offender before reporting.
      - name: Test naming honesty (a test_*.py must be able to fail)
        run: python backend/test_naming_honesty.py

      - name: Every python file compiles
        run: python -m compileall -q backend

      - name: Python static checks
        run: python -m pyflakes backend

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Frontend lockfile, build and high-severity audit
        run: |
          npm ci
          npm run build
          npm audit --audit-level=high

  # Ubuntu module tests cannot verify Batch parsing, label targets, escaping or goto behaviour.
  # start.bat is the launch gate for every evidence run, so it is validated on the OS that runs it.
  startbat:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r backend/requirements.txt
          pip install --quiet joblib scikit-learn lightgbm catboost pyflakes

      # Parses the whole file and prints the resolved configuration without launching servers.
      - name: start.bat parses and resolves configuration
        shell: cmd
        run: |
          set BTC_VALIDATE_STARTUP=1
          call start.bat
          if errorlevel 1 exit /b 1

      - name: Every invariant selftest passes on Windows
        shell: cmd
        run: |
          python -m backend.trade_forecast.test_audit_fixes || exit /b 1
          python -m backend.trade_forecast.test_builder_integration || exit /b 1
          python -m backend.trade_forecast.test_complete_trade_forecast || exit /b 1
          python backend/trade_forecast/forward_evidence.py --selftest || exit /b 1
          python -m backend.trade_forecast.freeze_complete_trade_threshold --selftest || exit /b 1
          python backend/trade_forecast/m0_gates.py --selftest || exit /b 1
          python -m backend.trade_forecast.test_ledger_v2_end_to_end || exit /b 1
          python -m backend.trade_forecast.test_evidence_completion || exit /b 1
          python -m backend.trade_forecast.evaluate_complete_trade_m0_v2_forward --selftest || exit /b 1
          python -m backend.trade_forecast.test_serving_integration || exit /b 1
          python backend/trade_forecast/champion_resolver.py --selftest || exit /b 1
          python backend/trade_forecast/freeze_guard.py --selftest || exit /b 1
          python backend/test_quarantine_and_feed.py || exit /b 1
          python backend/feed_writer.py --selftest || exit /b 1
          python backend/test_feed_writer_load.py || exit /b 1
          python backend/test_regime_causal_filter.py || exit /b 1
          python backend/test_kelly_scratch_handling.py || exit /b 1
          python backend/test_kelly_scratch_semantics.py || exit /b 1
          python backend/test_endogenous_kelly.py || exit /b 1
          python backend/test_launcher_integrity.py || exit /b 1
          python tests/test_repository_layout.py || exit /b 1
          python backend/model_registry.py --selftest || exit /b 1
          python backend/model_artifacts.py --selftest || exit /b 1
          python backend/verified_io.py --selftest || exit /b 1
          python backend/artifact_migration_status.py --selftest || exit /b 1
          python backend/control_auth.py --selftest || exit /b 1
          python backend/test_close_only_authority.py || exit /b 1
          python backend/test_polymarket_client_protocol.py || exit /b 1
          python backend/test_feed_protocol_health.py || exit /b 1
          python backend/task_supervisor.py --selftest || exit /b 1
          python backend/trading_authority.py --selftest || exit /b 1
          python backend/order_lifecycle.py --selftest || exit /b 1
          python backend/test_control_plane_security.py || exit /b 1
          python backend/head_permissions.py --selftest || exit /b 1
          python backend/promote_challenger.py --selftest || exit /b 1
          python research/run_all_sequence.py --selftest || exit /b 1
          python backend/preflight_longwindow.py --selftest || exit /b 1
          python backend/venues/multi_venue_recorder.py --selftest || exit /b 1
          python backend/venues/venue_admissibility.py --selftest || exit /b 1
          python backend/venues/binance_l2_recorder.py --selftest || exit /b 1
          python backend/venues/rl_data_readiness.py || exit /b 1
          python -m backend.quant_platform.test_kernel || exit /b 1
          python -m backend.binance_paper.test_engine || exit /b 1
          python -m backend.quant_platform.test_research_validation || exit /b 1
          python research/maker_lever_test.py --selftest || exit /b 1
          python -m backend.research.hierarchical_ensemble_v1.selftest || exit /b 1
          python -m backend.research.forecast_adapters_v1.selftest || exit /b 1
          python -m backend.research.profit_campaign_v1.selftest || exit /b 1
          python backend/test_kline_time_contract.py || exit /b 1
          python backend/test_feature_and_weight_fixes.py || exit /b 1
          python backend/report_master_runtime_state.py --selftest || exit /b 1
          python backend/phold_calibrator.py --selftest || exit /b 1
          python backend/check_feature_contract.py
          python -m backend.research.event_conditional_v1.selftest || exit /b 1
          python -m backend.research.event_conditional_v1.readiness || exit /b 1
          python backend/research/verify_prereg_hashes.py || exit /b 1
          python -m backend.binance_paper.selftest || exit /b 1
          python -m backend.binance_paper.api_selftest || exit /b 1
          python -m compileall -q backend || exit /b 1
          python -m pyflakes backend || exit /b 1
